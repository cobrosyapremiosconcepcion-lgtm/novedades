<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novedades | OGA de Cobros y Apremios - Poder Judicial de Tucumán</title>
  <meta name="description" content="Canal oficial de novedades, resoluciones, instructivos y avisos urgentes de la Oficina de Gestión Asociada de Cobros y Apremios.">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Netlify Identity Widget (Necesario para que funcione el login en Decap CMS) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- Encabezado Institucional (Diseño Claro al estilo de acordadas.justucuman.gov.ar) -->
  <header>
    <div class="header-container">
      <div class="brand">
        <!-- Logo oficial suministrado -->
        <img src="assets/logo.jpg" alt="Logo Corte Suprema de Justicia - Poder Judicial de Tucumán - OGA Cobros y Apremios Concepcion" class="brand-logo">
      </div>
      <div class="nav-links">
        <!-- Este botón redirige al panel autoadministrable de Decap CMS -->
        <a href="admin/" class="nav-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Panel Administrador
        </a>
      </div>
    </div>
  </header>

  <!-- Cuerpo Principal (Ancho completo centrado sin barra lateral) -->
  <main class="main-wrapper">
    
    <!-- Sección de Contenido (Noticias) -->
    <section class="content-section">
      
      <!-- Banner de Avisos Urgentes (Se activa dinámicamente vía JS) -->
      <div id="urgent-alert" class="urgent-banner">
        <div class="urgent-icon">🚨</div>
        <div class="urgent-content">
          <h3 id="urgent-title">Aviso de Interés Urgente</h3>
          <p id="urgent-desc">Cargando aviso...</p>
        </div>
      </div>

      <!-- Buscador y Filtros -->
      <div class="search-filter-section">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input" placeholder="Buscar por título, palabra clave o contenido...">
        </div>
        <div class="filter-tags" id="filter-tags-container">
          <span class="filter-label">Filtrar por:</span>
          <!-- Se generarán dinámicamente vía JS (el botón "Todos" y las categorías de noticias.json) -->
        </div>
      </div>

      <!-- Contenedor dinámico de novedades -->
      <div id="news-list" class="news-container">
        <!-- Renderizado por JS -->
        <div class="no-results">
          <p>Cargando novedades oficiales...</p>
        </div>
      </div>
      
    </section>
  </main>

  <!-- Pie de Página -->
  <footer>
    <div class="footer-content">
      <div class="footer-brand">
        <h2>Poder Judicial de Tucumán</h2>
        <p>Oficina de Gestión Asociada de Cobros y Apremios Concepcion</p>
      </div>
      <div class="footer-copy">
        &copy; 2026 OGA Cobros y Apremios. Todos los derechos reservados.
      </div>
    </div>
  </footer>

  <!-- Scripts del Sistema -->
  <script src="js/app.js"></script>
  <script>
    // Redirige al login de Decap CMS si viene desde una invitación por correo de Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
